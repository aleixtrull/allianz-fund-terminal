name: Update Fund Composition

on:
  schedule:
    # Lunes a las 06:00 UTC (08:00 Madrid) — composición cambia mensualmente
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch fund composition data
        env:
          # Flags necesarios para Chrome en entorno headless sin sandbox (CI)
          SELENIUM_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
          SELENIUM_DRIVER_WAIT_TIME: "10"
        run: |
          mkdir -p data
          python fetch_fund_composition.py --workers 1 --data-dir data

      - name: Commit composition data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fund_composition.json
          git diff --staged --quiet || {
            git commit -m "chore: update fund composition [skip ci]"
            git pull --rebase origin main
            git push
          }
